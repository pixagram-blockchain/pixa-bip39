[package]
name = "pixa_bip39"
version = "0.0.7"
edition = "2024"
repository = "https://github.com/pixagram-blockchain/pixa-bip39"
authors = ["Affolter Matias"]
description = "WASM-ready BIP-39 mnemonic + base58 master key generator with brute-force resistance"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = "1"
serde-wasm-bindgen = "0.6"
bip39 = { version = "2", features = ["czech", "french", "italian", "japanese", "korean", "portuguese", "spanish"] }
sha2 = "0.10"
bs58 = "0.5"
rand = "0.8"
# `js` routes OsRng to crypto.getRandomValues on wasm32-unknown-unknown.
# Without it the wasm build fails at compile time — there is no silent fallback.
getrandom = { version = "0.2", features = ["js"] }
zeroize = "1"
